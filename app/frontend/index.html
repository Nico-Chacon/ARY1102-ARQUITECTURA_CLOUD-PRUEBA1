<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshBox - Productos Organicos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>&#x1F34E;</text></svg>">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>FreshBox SpA</h1>
        <p>Catalogo Online de Productos Organicos - EP1 ARY1102</p>
    </header>
    <main>
        <section id="productos-section">
            <h2>Listado de Productos</h2>
            <button id="btn-cargar" onclick="cargarProductos()">Cargar productos</button>
            <table id="tabla-productos">
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>Descripcion</th><th>Precio</th><th>Stock</th><th>Categoria</th><th>Acciones</th></tr>
                </thead>
                <tbody id="productos-body"></tbody>
            </table>
        </section>
        <section id="formulario-section">
            <h2 id="form-titulo">Nuevo Producto</h2>
            <form id="producto-form" onsubmit="guardarProducto(event)">
                <input type="hidden" id="producto-id">
                <div class="form-group"><label for="nombre">Nombre:</label><input type="text" id="nombre" required></div>
                <div class="form-group"><label for="descripcion">Descripcion:</label><textarea id="descripcion" rows="2"></textarea></div>
                <div class="form-group"><label for="precio">Precio ($):</label><input type="number" id="precio" min="1" step="10" required></div>
                <div class="form-group"><label for="stock">Stock:</label><input type="number" id="stock" min="0" required></div>
                <div class="form-group"><label for="categoria">Categoria:</label><input type="text" id="categoria"></div>
                <div class="form-actions">
                    <button type="submit" id="btn-guardar">Guardar</button>
                    <button type="button" onclick="cancelarEdicion()">Cancelar</button>
                </div>
            </form>
            <p id="mensaje"></p>
        </section>
    </main>
    <footer><p>FreshBox SpA - EP1 ARY1102 Arquitectura Cloud - DuocUC 2026 | Dise&#241;ador asignatura: Ignacio A. Pastenet M.</p></footer>
    <script src="js/app.js"></script>
</body>
</html>
