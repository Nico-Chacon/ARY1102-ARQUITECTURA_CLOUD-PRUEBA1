name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
  workflow_dispatch:

env:
  TF_VAR_email_sns:           ${{ secrets.EMAIL_SNS }}
  TF_VAR_db_root_password:    ${{ secrets.DB_ROOT_PASSWORD }}
  TF_VAR_db_password:         ${{ secrets.DB_PASSWORD }}
  TF_VAR_owner_name:          ${{ secrets.OWNER_NAME }}
  TF_VAR_backup_iam_role_arn: ${{ secrets.BACKUP_IAM_ROLE_ARN }}

jobs:
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials (AWS Academy Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: ./environments/dev
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ./environments/dev
        run: terraform validate

      - name: Terraform Format Check
        working-directory: ./environments/dev
        continue-on-error: true
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        working-directory: ./environments/dev
        run: terraform plan -input=false -no-color
